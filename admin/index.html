<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gestor · Productor Musical Pro</title><style>
:root{--g:#ffd700;--green:#00e676;--red:#ff4141;--bg:#050505;--p:#101010;--m:#aaa;--line:rgba(255,215,0,.28)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#211b00,#050505 30%);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px 14px 70px}h1,h2,h3{margin:0 0 10px}.gold{color:var(--g)}.panel,.card,.module{background:rgba(15,15,15,.94);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}input,textarea,select{width:100%;background:#111;border:1px solid #333;color:#fff;border-radius:12px;padding:12px;font:inherit}textarea{min-height:95px}button,.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900;background:var(--g);color:#000;cursor:pointer}.dark{background:#262626;color:#fff;border:1px solid #444}.red{background:var(--red);color:#fff}.green{background:var(--green);color:#001b0b}.tabs,.actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.tab.active{background:var(--g);color:#000}.view{display:none}.view.active{display:block}.muted{color:var(--m);font-size:13px;line-height:1.5}.status{padding:11px;border-radius:12px;margin-top:10px;display:none}.status.ok{display:block;background:#062b1a;border:1px solid #137a49}.status.err{display:block;background:#351010;border:1px solid #8a2525}.item{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center}.item img{width:90px;height:64px;object-fit:cover;border-radius:10px;background:#222}.badge{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:900}.premium{background:#ff2929}.free{background:var(--green);color:#001b0b}.lesson{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:8px 0}.module{background:#090909}.switch{display:flex;align-items:center;gap:8px}.switch input{width:auto}.hr{height:1px;background:#262626;margin:16px 0}.sticky{position:sticky;bottom:8px;background:rgba(0,0,0,.9);padding:9px;border-radius:14px;z-index:3}@media(max-width:760px){.grid,.grid3,.item,.lesson{grid-template-columns:1fr}.item img{width:100%;height:160px}.sticky{position:static}}</style></head><body><div class="wrap">
<div class="panel"><h1 class="gold">Gestor de contenido</h1><p class="muted">Productor Musical Pro · Cursos, Packs y Notificaciones</p><div class="grid"><input id="endpoint" placeholder="Worker"><input id="token" type="password" placeholder="Token de administrador"></div><div class="actions"><button onclick="loadData()">Cargar contenido</button><button class="dark" onclick="backup()">Exportar respaldo</button></div><div id="status" class="status"></div></div>
<div class="tabs"><button class="tab active" data-v="newCourse">+ Curso</button><button class="tab dark" data-v="courses">Todos los Cursos</button><button class="tab dark" data-v="newPack">+ Pack</button><button class="tab dark" data-v="packs">Todos los Packs</button><button class="tab dark" data-v="notices">Notificaciones</button></div>
<section id="newCourse" class="view active"><div id="courseEditor"></div></section><section id="courses" class="view"><div id="courseList"></div></section><section id="newPack" class="view"><div id="packEditor"></div></section><section id="packs" class="view"><div id="packList"></div></section><section id="notices" class="view"><div id="noticeEditor"></div><div id="noticeList"></div></section>
</div><script>
let data={appName:'Productor Musical Pro',version:1,schemaVersion:4,courses:[],packs:[],notifications:[]},editCourse=-1,editPack=-1,currentCourse=null,currentPack=null;const $=s=>document.querySelector(s),uid=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const endpoint=$('#endpoint'),token=$('#token');endpoint.value=localStorage.pmp_endpoint||'https://productor-musical-pro-api.mikimc-business.workers.dev';token.value=sessionStorage.pmp_token||'';endpoint.oninput=()=>localStorage.pmp_endpoint=endpoint.value.trim();token.oninput=()=>sessionStorage.pmp_token=token.value;
function status(m,ok=true){let s=$('#status');s.textContent=m;s.className='status '+(ok?'ok':'err')}function normalize(){return endpoint.value.trim().replace(/\/$/,'')}function ytId(v=''){v=String(v).trim();if(/^[\w-]{11}$/.test(v))return v;let m=v.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?[^\s#]*?v=|embed\/|shorts\/|live\/))([\w-]{11})/i);return m?m[1]:''}const thumb=id=>id?'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg':'';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.v));function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.tab').forEach(x=>{x.classList.toggle('active',x.dataset.v===v);x.classList.toggle('dark',x.dataset.v!==v)});if(v==='courses')renderCourses();if(v==='packs')renderPacks();if(v==='newCourse'&&editCourse<0)renderCourse(blankCourse());if(v==='newPack'&&editPack<0)renderPack(blankPack());if(v==='notices')renderNotices()}
function ensure(){data.courses=Array.isArray(data.courses)?data.courses:[];data.packs=Array.isArray(data.packs)?data.packs:[];data.notifications=Array.isArray(data.notifications)?data.notifications:[];data.courses.forEach(c=>{c.lessons=Array.isArray(c.lessons)?c.lessons:[];c.modules=Array.isArray(c.modules)?c.modules:[];c.resources=Array.isArray(c.resources)?c.resources:[];if(c.showOnHome===undefined)c.showOnHome=true;c.modules.forEach(m=>m.lessons=Array.isArray(m.lessons)?m.lessons:[])})}
async function loadData(){try{let r=await fetch(normalize()+'/api/content?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();ensure();renderCourses();renderPacks();renderNotices();status('Contenido cargado correctamente.')}catch(e){status('No se pudo cargar: '+e.message,false)}}
async function saveRemote(){let t=token.value.trim();if(!t)throw Error('Falta el token.');let r=await fetch(normalize()+'/api/admin/content',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+t},body:JSON.stringify(data)}),j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw Error(j.error||'HTTP '+r.status);data=j.content||data;ensure();status('Guardado correctamente.');return j}
function blankCourse(){return{id:uid('curso'),title:'',type:'free',category:'',instructor:'',banner:'',description:'',enabled:true,showOnHome:true,lessons:[],modules:[],resources:[]}}
function renderCourse(c){currentCourse=JSON.parse(JSON.stringify(c));let r=currentCourse.resources[0]||{title:'Descargar recursos del curso',url:''};$('#courseEditor').innerHTML=`<div class="panel"><h2 class="gold">${editCourse>=0?'Editar curso':'Añadir curso'}</h2><div class="grid3"><input id="ct" value="${esc(currentCourse.title)}" placeholder="Título"><select id="ctype"><option value="free" ${currentCourse.type==='free'?'selected':''}>Free</option><option value="premium" ${currentCourse.type==='premium'?'selected':''}>Premium</option></select><input id="ccat" value="${esc(currentCourse.category)}" placeholder="Categoría"><input id="cins" value="${esc(currentCourse.instructor)}" placeholder="Instructor"><input id="cban" value="${esc(currentCourse.banner)}" placeholder="URL portada"><label class="switch"><input id="chome" type="checkbox" ${currentCourse.showOnHome!==false?'checked':''}> Mostrar Curso en Home</label></div><textarea id="cdesc" placeholder="Descripción">${esc(currentCourse.description)}</textarea><label class="switch"><input id="cen" type="checkbox" ${currentCourse.enabled!==false?'checked':''}> Curso visible</label><div class="hr"></div><h3 class="gold">Clases generales</h3><div id="genLessons"></div><button class="dark" onclick="addGeneral()">+ Clase general</button><textarea id="bulkG" placeholder="Título | URL de YouTube"></textarea><button onclick="bulkGeneral()">Agregar líneas</button><div class="hr"></div><h3 class="gold">Módulos</h3><div id="modules"></div><button class="dark" onclick="addModule()">+ Añadir módulo</button><div class="hr"></div><h3 class="gold">Recursos DESCARGABLES</h3><div class="grid"><input id="rtitle" value="${esc(r.title||'Descargar recursos del curso')}" placeholder="Texto del botón"><input id="rurl" value="${esc(r.url||'')}" placeholder="URL descarga"></div><div class="sticky actions"><button class="green" onclick="saveCourse()">${editCourse>=0?'Guardar cambios':'Crear y guardar curso'}</button>${editCourse>=0?'<button class="dark" onclick="cancelCourse()">Cancelar</button>':''}</div></div>`;renderCourseParts()}
function renderCourseParts(){let gl=$('#genLessons');gl.innerHTML=currentCourse.lessons.map((l,i)=>lessonRow('g',i,l)).join('')||'<p class="muted">Sin clases generales.</p>';$('#modules').innerHTML=currentCourse.modules.map((m,mi)=>`<div class="module"><div class="grid"><input value="${esc(m.title||'Módulo '+(mi+1))}" oninput="currentCourse.modules[${mi}].title=this.value"><input value="${esc(m.description||'')}" oninput="currentCourse.modules[${mi}].description=this.value" placeholder="Descripción opcional"></div><div>${m.lessons.map((l,i)=>lessonRow('m'+mi,i,l)).join('')||'<p class="muted">Sin clases.</p>'}</div><button class="dark" onclick="addModLesson(${mi})">+ Clase</button><textarea id="bulkM${mi}" placeholder="Título | URL de YouTube"></textarea><div class="actions"><button onclick="bulkModule(${mi})">Agregar líneas</button><button class="red" onclick="currentCourse.modules.splice(${mi},1);renderCourseParts()">Eliminar módulo</button></div></div>`).join('')||'<p class="muted">Sin módulos.</p>'}
function lessonRow(scope,i,l){return `<div class="lesson"><input value="${esc(l.title||'')}" oninput="lf('${scope}',${i},'title',this.value)" placeholder="Título"><input value="${esc(l.videoId||'')}" onchange="lv('${scope}',${i},this)" placeholder="URL o ID YouTube"><button class="red" onclick="delLesson('${scope}',${i})">×</button></div>`}function lessonRef(s,i){return s==='g'?currentCourse.lessons[i]:currentCourse.modules[+s.slice(1)].lessons[i]}function lf(s,i,k,v){lessonRef(s,i)[k]=v}function lv(s,i,e){let id=ytId(e.value)||e.value.trim();if(!/^[\w-]{11}$/.test(id)){alert('URL de YouTube no reconocida');return}let l=lessonRef(s,i);l.videoId=id;l.thumbnail=thumb(id);e.value=id}function delLesson(s,i){if(s==='g')currentCourse.lessons.splice(i,1);else currentCourse.modules[+s.slice(1)].lessons.splice(i,1);renderCourseParts()}function addGeneral(){currentCourse.lessons.push({id:uid('clase'),title:'Nueva clase',videoId:'',thumbnail:''});renderCourseParts()}function addModule(){currentCourse.modules.push({id:uid('modulo'),title:'Módulo '+(currentCourse.modules.length+1),description:'',enabled:true,lessons:[]});renderCourseParts()}function addModLesson(i){currentCourse.modules[i].lessons.push({id:uid('clase'),title:'Nueva clase',videoId:'',thumbnail:''});renderCourseParts()}
function addBulk(txt,target){let n=0;String(txt||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{let p=line.split('|'),src=p.length>1?p.pop().trim():line,id=ytId(src);if(!id)return;let title=p.length?p.join('|').trim():'Clase '+(target.length+1);target.push({id:uid('clase'),title,videoId:id,thumbnail:thumb(id)});n++});return n}function bulkGeneral(){addBulk($('#bulkG').value,currentCourse.lessons);renderCourseParts()}function bulkModule(i){addBulk($('#bulkM'+i).value,currentCourse.modules[i].lessons);renderCourseParts()}
function readCourse(){currentCourse.title=$('#ct').value.trim();currentCourse.type=$('#ctype').value;currentCourse.category=$('#ccat').value.trim();currentCourse.instructor=$('#cins').value.trim();currentCourse.banner=$('#cban').value.trim();currentCourse.description=$('#cdesc').value.trim();currentCourse.enabled=$('#cen').checked;currentCourse.showOnHome=$('#chome').checked;let u=$('#rurl').value.trim();currentCourse.resources=u?[{id:uid('res'),title:$('#rtitle').value.trim()||'Descargar recursos del curso',url:u,enabled:true}]:[]}
async function saveCourse(){try{readCourse();if(!currentCourse.title)throw Error('Escribe título.');if(editCourse>=0)data.courses[editCourse]=currentCourse;else data.courses.push(currentCourse);await saveRemote();editCourse=-1;renderCourse(blankCourse());show('courses')}catch(e){status('No se pudo guardar: '+e.message,false)}}function cancelCourse(){editCourse=-1;renderCourse(blankCourse());show('courses')}function editC(i){editCourse=i;renderCourse(data.courses[i]);show('newCourse');scrollTo(0,0)}async function delC(i){if(!confirm('¿Eliminar curso?'))return;data.courses.splice(i,1);try{await saveRemote();renderCourses()}catch(e){status(e.message,false)}}function total(c){return(c.lessons||[]).length+(c.modules||[]).reduce((n,m)=>n+(m.lessons||[]).length,0)}function renderCourses(){$('#courseList').innerHTML='<div class="panel"><h2 class="gold">Todos los Cursos</h2></div>'+data.courses.map((c,i)=>`<div class="card item"><img src="${esc(c.banner)}"><div><span class="badge ${c.type==='premium'?'premium':'free'}">${c.type==='premium'?'PREMIUM':'FREE'}</span><h3>${esc(c.title)}</h3><span class="muted">${total(c)} clases · ${(c.modules||[]).length} módulos · ${c.showOnHome!==false?'HOME':'OCULTO HOME'}</span></div><div class="actions"><button onclick="editC(${i})">Editar</button><button class="red" onclick="delC(${i})">Eliminar</button></div></div>`).join('')}
function blankPack(){return{id:uid('pack'),title:'',category:'Sound Pack',cover:'',description:'',includesText:'',unlockUrl:'',downloadUrl:'',enabled:true,showOnHome:true}}function renderPack(p){currentPack=JSON.parse(JSON.stringify(p));$('#packEditor').innerHTML=`<div class="panel"><h2 class="gold">${editPack>=0?'Editar Pack':'Añadir Pack de Sonidos'}</h2><div class="grid"><input id="pt" value="${esc(currentPack.title)}" placeholder="Título del pack"><input id="pcat" value="${esc(currentPack.category)}" placeholder="Tipo: Drum Kit, Sample Pack..."><input id="pcover" value="${esc(currentPack.cover)}" placeholder="URL portada"><input id="punlock" value="${esc(currentPack.unlockUrl)}" placeholder="URL para desbloquear"><input id="pdownload" value="${esc(currentPack.downloadUrl)}" placeholder="URL de descarga"><label class="switch"><input id="phome" type="checkbox" ${currentPack.showOnHome!==false?'checked':''}> Mostrar Pack en Home</label></div><textarea id="pdesc" placeholder="Descripción">${esc(currentPack.description)}</textarea><textarea id="pinc" placeholder="Qué incluye el pack">${esc(currentPack.includesText)}</textarea><label class="switch"><input id="pen" type="checkbox" ${currentPack.enabled!==false?'checked':''}> Pack visible</label><div class="sticky actions"><button class="green" onclick="savePack()">${editPack>=0?'Guardar cambios':'Crear y guardar Pack'}</button></div></div>`}
async function savePack(){try{Object.assign(currentPack,{title:$('#pt').value.trim(),category:$('#pcat').value.trim(),cover:$('#pcover').value.trim(),unlockUrl:$('#punlock').value.trim(),downloadUrl:$('#pdownload').value.trim(),description:$('#pdesc').value.trim(),includesText:$('#pinc').value.trim(),enabled:$('#pen').checked,showOnHome:$('#phome').checked});if(!currentPack.title)throw Error('Escribe título del pack.');if(editPack>=0)data.packs[editPack]=currentPack;else data.packs.push(currentPack);await saveRemote();editPack=-1;renderPack(blankPack());show('packs')}catch(e){status(e.message,false)}}function editP(i){editPack=i;renderPack(data.packs[i]);show('newPack');scrollTo(0,0)}async function delP(i){if(!confirm('¿Eliminar pack?'))return;data.packs.splice(i,1);try{await saveRemote();renderPacks()}catch(e){status(e.message,false)}}function renderPacks(){$('#packList').innerHTML='<div class="panel"><h2 class="gold">Todos los Packs de Sonidos</h2></div>'+data.packs.map((p,i)=>`<div class="card item"><img src="${esc(p.cover)}"><div><span class="badge free">${esc(p.category||'PACK')}</span><h3>${esc(p.title)}</h3><span class="muted">${p.showOnHome!==false?'HOME':'OCULTO HOME'}</span></div><div class="actions"><button onclick="editP(${i})">Editar</button><button class="red" onclick="delP(${i})">Eliminar</button></div></div>`).join('')}
function renderNotices(){let targets=[...data.courses.map(c=>({id:c.id,label:'Curso · '+c.title,type:'course'})),...data.packs.map(p=>({id:p.id,label:'Pack · '+p.title,type:'pack'}))];$('#noticeEditor').innerHTML=`<div class="panel"><h2 class="gold">Enviar notificación</h2><div class="grid"><input id="nt" placeholder="Título de la notificación"><select id="ntarget"><option value="">Selecciona contenido</option>${targets.map(x=>`<option value="${x.type}|${esc(x.id)}">${esc(x.label)}</option>`).join('')}</select></div><textarea id="ntext" placeholder="Texto para los estudiantes"></textarea><button class="green" onclick="sendNotice()">Publicar notificación</button><p class="muted">La app mostrará la novedad en el botón de notificaciones y generará una notificación local cuando actualice el catálogo.</p></div>`;$('#noticeList').innerHTML=data.notifications.slice().sort((a,b)=>b.createdAt-a.createdAt).map(n=>`<div class="card"><b>${esc(n.title)}</b><p>${esc(n.text)}</p><span class="muted">${new Date(n.createdAt).toLocaleString()}</span></div>`).join('')}
async function sendNotice(){try{let [type,id]=($('#ntarget').value||'|').split('|'),title=$('#nt').value.trim(),text=$('#ntext').value.trim();if(!type||!id||!title||!text)throw Error('Completa título, contenido y texto.');data.notifications.push({id:uid('notice'),title,text,targetType:type,targetId:id,createdAt:Date.now(),enabled:true});await saveRemote();renderNotices();status('Notificación publicada.')}catch(e){status(e.message,false)}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='pmp-backup.json';a.click();URL.revokeObjectURL(a.href)}
renderCourse(blankCourse());renderPack(blankPack());ensure();renderCourses();renderPacks();renderNotices();
</script></body></html>
