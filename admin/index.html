<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Gestor de contenido · Productor Musical Pro</title>
<style>
:root{--bg:#050505;--panel:#0d0d0d;--panel2:#151515;--gold:#ffd700;--green:#00e676;--red:#ff3b3b;--muted:#aaa;--line:rgba(255,215,0,.24)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#191300 0,#050505 32%);color:#fff;font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:22px 16px 60px}.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}.brand img{width:76px;height:76px;object-fit:contain;border-radius:18px;background:#000;border:1px solid var(--line)}.brand h1{margin:0;color:var(--gold);font-size:28px}.brand p{margin:5px 0 0;color:var(--muted)}.toolbar,.panel,.course-card,.module,.lesson,.resource-box{background:rgba(13,13,13,.97);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}input,textarea,select{width:100%;background:#111;border:1px solid #303030;color:#fff;border-radius:11px;padding:12px;font:inherit;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,215,0,.08)}textarea{min-height:110px;resize:vertical}.actions,.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}button,.file-btn{border:0;border-radius:11px;padding:11px 14px;font-weight:900;cursor:pointer;background:var(--gold);color:#000;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}button.secondary,.file-btn{background:#262626;color:#fff;border:1px solid #444}button.green{background:var(--green);color:#001b0b}button.red{background:var(--red);color:#fff}.muted{color:var(--muted);font-size:13px;line-height:1.55}.status{margin-top:10px;padding:10px 12px;border-radius:10px;display:none}.status.ok{display:block;background:rgba(0,230,118,.12);border:1px solid rgba(0,230,118,.35);color:#8cffb8}.status.err{display:block;background:rgba(255,59,59,.12);border:1px solid rgba(255,59,59,.35);color:#ff9e9e}.topnote{background:rgba(255,215,0,.07);border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:10px;color:#ddd;font-size:13px;line-height:1.55}.view{display:none}.view.active{display:block}.tabs button.active{background:var(--gold);color:#000}.section-title{font-size:18px;color:var(--gold);font-weight:900;margin:20px 0 9px}.course-card{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center}.course-card img{width:110px;height:72px;object-fit:cover;border-radius:11px;background:#111}.course-card h3{margin:0 0 6px;color:#fff}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900}.free{background:var(--green);color:#001b0b}.premium{background:#ff2c2c;color:#fff}.empty{padding:35px;text-align:center;color:#999;border:1px dashed #333;border-radius:16px}.lesson{display:grid;grid-template-columns:70px 1fr 1fr auto;gap:8px;align-items:center;padding:9px;border-color:#292929}.lesson img{width:70px;height:44px;object-fit:cover;border-radius:8px;background:#222}.module{border-color:rgba(255,215,0,.18);background:#090909}.module-head{display:flex;gap:8px;align-items:center}.module-head input{flex:1}.switchrow{display:flex;align-items:center;gap:8px;color:#ddd}.switchrow input{width:auto}.bulk{margin-top:10px;background:#0a0a0a;border:1px dashed #3a3a3a;border-radius:14px;padding:12px}.bulk textarea{min-height:82px}.course-count{color:#bbb;font-size:13px}.danger-note{color:#ffb3b3;font-size:12px}.save-row{position:sticky;bottom:10px;z-index:5;background:rgba(0,0,0,.88);padding:9px;border-radius:14px;border:1px solid rgba(255,215,0,.16)}
@media(max-width:780px){.grid,.grid3{grid-template-columns:1fr}.lesson{grid-template-columns:1fr}.course-card{grid-template-columns:1fr}.course-card img{width:100%;height:170px}.brand h1{font-size:23px}.save-row{position:static}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="../assets/logo.png" alt="Productor Musical Pro"><div><h1>Gestor de contenido</h1><p>Productor Musical Pro · Cursos Free y Premium</p></div></div>
  <div class="toolbar">
    <div class="grid"><input id="endpoint" placeholder="https://tu-worker.workers.dev" autocomplete="url"><input id="token" type="password" placeholder="Token de administrador" autocomplete="off"></div>
    <div class="actions"><button onclick="loadData()">Cargar contenido</button><button class="secondary" onclick="exportBackup()">Exportar respaldo</button><label class="file-btn"><input id="importFile" type="file" accept="application/json" hidden onchange="importBackup(event)">Importar respaldo</label></div>
    <div class="topnote">El endpoint se guarda solo en este navegador. El token permanece únicamente durante esta pestaña y nunca se publica en GitHub.</div><div id="status" class="status"></div>
  </div>

  <div class="tabs"><button id="tabNew" class="active" onclick="showView('editor')">+ Añadir curso</button><button id="tabAll" class="secondary" onclick="showView('all')">Todos los Cursos</button></div>

  <section id="editorView" class="view active"><div id="editor"></div></section>
  <section id="allView" class="view"><div class="panel"><h2 style="margin:0;color:var(--gold)">Todos los Cursos</h2><p class="muted">Aquí puedes editar o eliminar los cursos que ya están publicados.</p></div><div id="courseCards"></div></section>
</div>
<script>
let data={appName:'Productor Musical Pro',version:1,courses:[]}, editingIndex=-1;
const $=s=>document.querySelector(s), endpointEl=$('#endpoint'), tokenEl=$('#token');
endpointEl.value=localStorage.getItem('pmp_endpoint')||'https://productor-musical-pro-api.mikimc-business.workers.dev'; tokenEl.value=sessionStorage.getItem('pmp_token')||'';
endpointEl.addEventListener('input',()=>localStorage.setItem('pmp_endpoint',endpointEl.value.trim())); tokenEl.addEventListener('input',()=>sessionStorage.setItem('pmp_token',tokenEl.value));
const esc=(v='')=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const uid=(p='id')=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); const normalizeEndpoint=()=>endpointEl.value.trim().replace(/\/$/,'');
function ytId(v=''){v=String(v||'').trim();if(/^[A-Za-z0-9_-]{11}$/.test(v))return v;let m=v.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?[^\s#]*?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/i);if(m)return m[1];m=v.match(/[?&]v=([A-Za-z0-9_-]{11})/i);if(m)return m[1];m=v.match(/(?:^|[^A-Za-z0-9_-])([A-Za-z0-9_-]{11})(?:[^A-Za-z0-9_-]|$)/);return m?m[1]:''}
const thumb=id=>id?'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg':''; function setStatus(msg,ok=true){let s=$('#status');s.textContent=msg;s.className='status '+(ok?'ok':'err')}
function blankCourse(){return{id:uid('curso'),title:'',type:'free',category:'',instructor:'',banner:'',description:'',enabled:true,lessons:[],modules:[],resources:[]}}
function ensure(c){c.lessons=Array.isArray(c.lessons)?c.lessons:[];c.modules=Array.isArray(c.modules)?c.modules:[];c.resources=Array.isArray(c.resources)?c.resources:[];return c}
function showView(v){$('#editorView').classList.toggle('active',v==='editor');$('#allView').classList.toggle('active',v==='all');$('#tabNew').className=v==='editor'?'active':'secondary';$('#tabAll').className=v==='all'?'active':'secondary';if(v==='all')renderCards();else if(editingIndex<0)renderEditor(blankCourse())}
async function loadData(){try{let e=normalizeEndpoint();if(!e)throw Error('Escribe la URL del Worker.');setStatus('Cargando...');let r=await fetch(e+'/api/content',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();if(!Array.isArray(data.courses))data.courses=[];data.courses.forEach(ensure);editingIndex=-1;renderEditor(blankCourse());renderCards();setStatus('Contenido cargado correctamente.');}catch(err){setStatus('No se pudo cargar: '+err.message,false)}}
async function saveRemote(){let e=normalizeEndpoint(),t=tokenEl.value.trim();if(!e||!t)throw Error('Falta endpoint o token.');data.appName='Productor Musical Pro';setStatus('Guardando...');let r=await fetch(e+'/api/admin/content',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+t},body:JSON.stringify(data)});let res=await r.json().catch(()=>({}));if(!r.ok||!res.ok)throw Error(res.error||('HTTP '+r.status));data.version=res.version||data.version;setStatus('Guardado correctamente. La app recibirá los cambios al volver a cargar el catálogo.');}
function renderEditor(course){course=ensure(course);const r=course.resources[0]||{title:'Descargar recursos del curso',url:''};$('#editor').innerHTML=`<div class="panel"><h2 style="margin-top:0;color:var(--gold)">${editingIndex>=0?'Editar curso':'Añadir nuevo curso'}</h2><div class="grid3"><input id="cTitle" value="${esc(course.title)}" placeholder="Título del curso"><select id="cType"><option value="free" ${course.type==='free'?'selected':''}>Free</option><option value="premium" ${course.type==='premium'?'selected':''}>Premium</option></select><input id="cCategory" value="${esc(course.category)}" placeholder="Categoría (Beatmaker, Mezcla...)"><input id="cInstructor" value="${esc(course.instructor)}" placeholder="Instructor"><input id="cBanner" value="${esc(course.banner)}" placeholder="URL portada / banner"><label class="switchrow"><input id="cEnabled" type="checkbox" ${course.enabled!==false?'checked':''}> Curso visible en la app</label></div><textarea id="cDesc" placeholder="Descripción del curso">${esc(course.description)}</textarea>
<div class="section-title">Clases generales</div><div id="generalLessons"></div><div class="actions"><button class="secondary" onclick="addGeneralLesson()">+ Agregar clase</button></div><div class="bulk"><div class="muted">Agregar varias clases: Título | URL de YouTube</div><textarea id="bulkGeneral" placeholder="1: Introducción | https://youtu.be/XXXXXXXXXXX"></textarea><button onclick="bulkGeneral()">Agregar líneas</button></div>
<div class="section-title">Módulos</div><div id="modules"></div><button class="secondary" onclick="addModule()">+ Añadir módulo</button>
<div class="section-title">Recursos DESCARGABLES</div><div class="resource-box"><div class="grid"><input id="resourceTitle" value="${esc(r.title||'Descargar recursos del curso')}" placeholder="Texto del botón de descarga"><input id="resourceUrl" value="${esc(r.url||'')}" placeholder="URL del recurso descargable"></div><p class="muted">El botón de descarga solo aparecerá dentro del curso cuando exista una URL.</p></div>
<div class="save-row actions"><button class="green" onclick="saveCourse()">${editingIndex>=0?'Guardar cambios del curso':'Crear y guardar curso'}</button>${editingIndex>=0?'<button class="secondary" onclick="cancelEdit()">Cancelar edición</button>':''}</div></div>`; renderGeneral(course);renderModules(course);window.currentCourse=course;}
function readBase(c){c.title=$('#cTitle').value.trim();c.type=$('#cType').value;c.category=$('#cCategory').value.trim();c.instructor=$('#cInstructor').value.trim();c.banner=$('#cBanner').value.trim();c.description=$('#cDesc').value.trim();c.enabled=$('#cEnabled').checked;let ru=$('#resourceUrl').value.trim(),rt=$('#resourceTitle').value.trim()||'Descargar recursos del curso';c.resources=ru?[{title:rt,url:ru}]:[];return c}
function lessonHtml(l,j,scope){return `<div class="lesson" data-scope="${scope}" data-index="${j}"><div><img src="${esc(l.thumbnail||thumb(l.videoId))}"><div class="muted">Clase ${j+1}</div></div><input class="lesson-title-input" value="${esc(l.title||'')}" placeholder="Título" oninput="lessonField('${scope}',${j},'title',this.value)"><input class="lesson-video-input" value="${esc(l.videoId||'')}" placeholder="URL o ID de YouTube" onchange="lessonVideo('${scope}',${j},this)"><button class="red" onclick="deleteLesson('${scope}',${j})">×</button></div>`}
function renderGeneral(c){$('#generalLessons').innerHTML=c.lessons.length?c.lessons.map((l,j)=>lessonHtml(l,j,'g')).join(''):'<div class="muted">Sin clases generales.</div>'}
function renderModules(c){$('#modules').innerHTML=c.modules.length?c.modules.map((m,mi)=>`<div class="module"><div class="module-head"><input value="${esc(m.title||'Módulo '+(mi+1))}" oninput="moduleTitle(${mi},this.value)"><button class="red" onclick="deleteModule(${mi})">Eliminar módulo</button></div><div id="modLessons-${mi}">${(m.lessons||[]).map((l,j)=>lessonHtml(l,j,'m'+mi)).join('')||'<div class="muted">Sin clases en este módulo.</div>'}</div><div class="actions"><button class="secondary" onclick="addModuleLesson(${mi})">+ Agregar clase al módulo</button></div><div class="bulk"><textarea id="bulkM-${mi}" placeholder="Título | URL de YouTube"></textarea><button onclick="bulkModule(${mi})">Agregar líneas</button></div></div>`).join(''):'<div class="muted">Este curso no tiene módulos. Puedes añadirlos si el curso está organizado por secciones.</div>'}
function lessonField(scope,j,key,val){let c=currentCourse,l=scope==='g'?c.lessons[j]:c.modules[+scope.slice(1)].lessons[j];l[key]=val}
function lessonVideo(scope,j,el){let id=ytId(el.value);if(!id){alert('No pude reconocer ese enlace de YouTube.');return}let c=currentCourse,l=scope==='g'?c.lessons[j]:c.modules[+scope.slice(1)].lessons[j];l.videoId=id;l.thumbnail=thumb(id);el.value=id;scope==='g'?renderGeneral(c):renderModules(c)}
function deleteLesson(scope,j){let c=currentCourse;if(scope==='g')c.lessons.splice(j,1);else c.modules[+scope.slice(1)].lessons.splice(j,1);renderGeneral(c);renderModules(c)}
function addGeneralLesson(){currentCourse.lessons.push({id:uid('clase'),title:'Nueva clase',videoId:'',thumbnail:''});renderGeneral(currentCourse)}
function addModule(){currentCourse.modules.push({id:uid('modulo'),title:'Módulo '+(currentCourse.modules.length+1),lessons:[]});renderModules(currentCourse)}
function moduleTitle(i,v){currentCourse.modules[i].title=v} function deleteModule(i){if(confirm('¿Eliminar este módulo y sus clases?')){currentCourse.modules.splice(i,1);renderModules(currentCourse)}}
function addModuleLesson(i){currentCourse.modules[i].lessons.push({id:uid('clase'),title:'Nueva clase',videoId:'',thumbnail:''});renderModules(currentCourse)}
function addBulk(lines,target){let added=0;for(let line of String(lines||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean)){let parts=line.split('|'),src=parts.length>1?parts.pop().trim():line,id=ytId(src);if(!id){id=ytId(line)}if(!id)continue;let title=parts.length?parts.join('|').trim():line.replace(/https?:\/\/\S+/ig,'').replace(/\[[^\]]*\]\([^)]*\)/g,'').replace(/^\s*\d+\s*[.):-]?\s*/,'').trim();if(!title||title===line)title='Clase '+(target.length+1);target.push({id:uid('clase'),title,videoId:id,thumbnail:thumb(id)});added++}return added}
function bulkGeneral(){let ta=$('#bulkGeneral'),n=addBulk(ta.value,currentCourse.lessons);ta.value='';renderGeneral(currentCourse);setStatus('Se agregaron '+n+' clases.')} function bulkModule(i){let ta=$('#bulkM-'+i),n=addBulk(ta.value,currentCourse.modules[i].lessons);ta.value='';renderModules(currentCourse);setStatus('Se agregaron '+n+' clases al módulo.')}
function syncVisibleLessons(){document.querySelectorAll('.lesson[data-scope]').forEach(row=>{let scope=row.dataset.scope,j=+row.dataset.index,c=currentCourse,l=scope==='g'?c.lessons[j]:((c.modules[+scope.slice(1)]||{}).lessons||[])[j];if(!l)return;let ti=row.querySelector('.lesson-title-input'),vi=row.querySelector('.lesson-video-input');if(ti)l.title=ti.value.trim();if(vi&&vi.value.trim()){let id=ytId(vi.value);if(id){l.videoId=id;l.thumbnail=thumb(id);vi.value=id}}});}
function commitPendingBulk(){let total=0,bg=$('#bulkGeneral');if(bg&&bg.value.trim()){total+=addBulk(bg.value,currentCourse.lessons);bg.value=''}(currentCourse.modules||[]).forEach((m,i)=>{let ta=$('#bulkM-'+i);if(ta&&ta.value.trim()){total+=addBulk(ta.value,m.lessons);ta.value=''}});return total}
async function saveCourse(){try{syncVisibleLessons();let pending=commitPendingBulk();let c=readBase(currentCourse);if(!c.title)throw Error('Escribe el título del curso.');if(editingIndex>=0)data.courses[editingIndex]=c;else{data.courses.push(c);editingIndex=data.courses.length-1;}await saveRemote();renderCards();showView('all');editingIndex=-1;if(pending)setStatus('Curso guardado correctamente. También se añadieron '+pending+' clases que estaban pendientes en los módulos.');}catch(e){setStatus('No se pudo guardar: '+e.message,false)}}
function cancelEdit(){editingIndex=-1;renderEditor(blankCourse());showView('all')} function editCourse(i){editingIndex=i;renderEditor(JSON.parse(JSON.stringify(ensure(data.courses[i]))));showView('editor');window.scrollTo({top:0,behavior:'smooth'})}
async function deleteCourse(i){if(!confirm('¿Eliminar este curso y todas sus clases/módulos?'))return;let old=data.courses.splice(i,1)[0];try{await saveRemote();renderCards()}catch(e){data.courses.splice(i,0,old);setStatus('No se pudo eliminar: '+e.message,false)}}
function totalLessons(c){return (c.lessons||[]).length+(c.modules||[]).reduce((n,m)=>n+(m.lessons||[]).length,0)}
function renderCards(){let root=$('#courseCards');if(!data.courses.length){root.innerHTML='<div class="empty">Todavía no hay cursos guardados.</div>';return}root.innerHTML=data.courses.map((c,i)=>`<article class="course-card"><img src="${esc(c.banner||'')}" alt=""><div><div><span class="badge ${c.type==='premium'?'premium':'free'}">${c.type==='premium'?'PREMIUM':'FREE'}</span></div><h3>${esc(c.title||'Sin título')}</h3><div class="course-count">${totalLessons(c)} clases · ${(c.modules||[]).length} módulos · ${esc(c.category||'Sin categoría')}</div>${(c.resources||[]).some(r=>r.url)?'<div class="muted">Incluye recursos descargables</div>':''}</div><div class="actions"><button onclick="editCourse(${i})">Editar curso</button><button class="red" onclick="deleteCourse(${i})">Eliminar</button></div></article>`).join('')}
function exportBackup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='productor-musical-pro-contenido.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(ev){let f=ev.target.files&&ev.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!Array.isArray(x.courses))throw Error('JSON inválido');data=x;data.courses.forEach(ensure);renderCards();setStatus('Respaldo importado. Abre un curso y guárdalo o crea uno nuevo para publicarlo.');showView('all')}catch(e){setStatus('No se pudo importar: '+e.message,false)}};rd.readAsText(f);ev.target.value=''}
renderEditor(blankCourse());renderCards();
</script>
</body>
</html>
